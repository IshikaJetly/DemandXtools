<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earnings Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f2f5;
    font-size: 13px;
    color: #2c2c2c;
    overflow: hidden;
  }
  .wrap { padding: 10px; display: flex; flex-direction: column; gap: 8px; }

  /* Job card */
  .job-card { background: #fff; border: 1px solid #e2e4e8; border-radius: 8px; padding: 12px 14px; position: relative; }
  .job-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .job-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #6b7280; }
  .job-num { background: #3b82f6; color: #fff; font-size: 10px; font-weight: 700; border-radius: 20px; padding: 2px 8px; margin-left: 6px; }
  .remove-btn { background: none; border: none; cursor: pointer; color: #d1d5db; font-size: 16px; line-height: 1; padding: 0 2px; transition: color 0.15s; }
  .remove-btn:hover { color: #ef4444; }

  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; color: #6b7280; font-weight: 500; }
  .field input {
    height: 30px; border: 1px solid #d1d5db; border-radius: 5px;
    padding: 0 8px; font-size: 12px; color: #111827; background: #fff;
    outline: none; transition: border-color 0.15s, box-shadow 0.15s; width: 100%;
  }
  .field input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }

  /* Per-job result */
  .job-result { margin-top: 8px; padding: 8px 10px; border-radius: 6px; font-size: 11px; }
  .job-result.empty { background: #f9fafb; border: 1px solid #e5e7eb; color: #9ca3af; text-align: center; }
  .job-result.filled { background: #eff6ff; border: 1px solid #bfdbfe; }
  .job-result-amount { font-size: 16px; font-weight: 700; color: #1d4ed8; }
  .job-result-meta { color: #6b7280; margin-top: 2px; }

  /* Add job button */
  .add-btn {
    background: #fff; border: 1.5px dashed #d1d5db; border-radius: 8px;
    padding: 10px; width: 100%; cursor: pointer; font-size: 12px; font-weight: 600;
    color: #6b7280; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .add-btn:hover { border-color: #3b82f6; color: #3b82f6; background: #eff6ff; }

  /* Divider */
  .divider { border: none; border-top: 1px solid #e5e7eb; margin: 2px 0; }

  /* Stated + total section */
  .summary-card { background: #fff; border: 1px solid #e2e4e8; border-radius: 8px; padding: 12px 14px; }
  .summary-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #6b7280; margin-bottom: 10px; }
  .stated-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .stated-row label { font-size: 11px; color: #6b7280; font-weight: 500; white-space: nowrap; }
  .dollar { font-size: 13px; color: #9ca3af; }
  .stated-row input {
    height: 30px; border: 1px solid #d1d5db; border-radius: 5px;
    padding: 0 8px; font-size: 12px; color: #111827; width: 140px;
    outline: none; transition: border-color 0.15s, box-shadow 0.15s;
  }
  .stated-row input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
  .hint { font-size: 10px; color: #9ca3af; margin-top: 3px; }

  /* Total result */
  #total-result { margin-top: 10px; }
  .total-box { border-radius: 7px; padding: 10px 12px; }
  .total-match    { background: #f0fdf4; border: 1px solid #86efac; }
  .total-mismatch { background: #fef2f2; border: 1px solid #fca5a5; }
  .total-neutral  { background: #f9fafb; border: 1px solid #e5e7eb; }
  .total-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .total-label { font-size: 11px; color: #6b7280; font-weight: 500; margin-bottom: 2px; }
  .total-amount { font-size: 24px; font-weight: 700; }
  .total-match .total-amount    { color: #15803d; }
  .total-mismatch .total-amount { color: #b91c1c; }
  .total-neutral .total-amount  { color: #111827; }

  /* Job breakdown inside total */
  .job-breakdown { margin-top: 6px; border-top: 1px solid rgba(0,0,0,0.06); padding-top: 6px; display: flex; flex-direction: column; gap: 3px; }
  .job-breakdown-row { display: flex; justify-content: space-between; font-size: 11px; color: #6b7280; }
  .job-breakdown-row span { font-weight: 500; color: #374151; }

  .status-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .badge-match    { background: #dcfce7; color: #15803d; }
  .badge-mismatch { background: #fee2e2; color: #b91c1c; }
  .badge-neutral  { background: #f3f4f6; color: #6b7280; }

  .alert { margin-top: 8px; padding: 7px 10px; border-radius: 5px; font-size: 11px; line-height: 1.55; }
  .alert-warn { background: #fff7ed; border-left: 3px solid #f97316; color: #7c2d12; }
  .alert-ok   { background: #f0fdf4; border-left: 3px solid #22c55e; color: #14532d; }

  .empty-hint { text-align: center; font-size: 11px; color: #9ca3af; padding: 6px 0; }
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <div id="jobs-container"></div>

  <button class="add-btn" onclick="addJob()">
    <span style="font-size:16px;line-height:1">+</span> Add another job
  </button>

  <hr class="divider">

  <div class="summary-card">
    <div class="summary-title">&#9635; Comparison — Stated vs Calculated</div>
    <div class="stated-row">
      <label>Claimant stated TOTAL earnings:</label>
      <span class="dollar">$</span>
      <input type="number" id="stated" placeholder="e.g. 10000" min="0" step="1" oninput="updateTotal()">
    </div>
    <p class="hint">Enter the combined total the claimant stated on the previous step</p>
    <div id="total-result"><div class="empty-hint">Fill in job details above to see totals</div></div>
  </div>

</div>

<script>
var jobCounter = 0;
var jobs = {};

function addJob() {
  jobCounter++;
  var id = jobCounter;
  jobs[id] = { calc: 0, valid: false };

  var container = document.getElementById('jobs-container');
  var div = document.createElement('div');
  div.className = 'job-card';
  div.id = 'job-' + id;
  div.innerHTML =
    '<div class="job-header">' +
      '<div class="job-title">&#9635; Job <span class="job-num">' + id + '</span></div>' +
      (id > 1 ? '<button class="remove-btn" onclick="removeJob(' + id + ')" title="Remove job">&times;</button>' : '<span></span>') +
    '</div>' +
    '<div class="grid3">' +
      '<div class="field"><label>Pay rate ($/hr)</label><input type="number" id="rate-'+id+'" placeholder="e.g. 15.00" min="0" step="0.01" oninput="calcJob('+id+')"></div>' +
      '<div class="field"><label>Avg hours/day</label><input type="number" id="hpd-'+id+'" placeholder="e.g. 8" min="0" step="0.5" oninput="calcJob('+id+')"></div>' +
      '<div class="field"><label>Avg days/week</label><input type="number" id="dpw-'+id+'" placeholder="e.g. 5" min="0" step="0.5" oninput="calcJob('+id+')"></div>' +
    '</div>' +
    '<div class="grid2">' +
      '<div class="field"><label>Start date</label><input type="date" id="start-'+id+'" oninput="calcJob('+id+')"></div>' +
      '<div class="field"><label>End date</label><input type="date" id="end-'+id+'" oninput="calcJob('+id+')"></div>' +
    '</div>' +
    '<div id="result-'+id+'" class="job-result empty">Enter details above to calculate this job</div>';

  container.appendChild(div);
  updateTotal();
}

function removeJob(id) {
  var el = document.getElementById('job-' + id);
  if (el) el.remove();
  delete jobs[id];
  updateTotal();
}

function calcJob(id) {
  var rate  = parseFloat(document.getElementById('rate-'+id).value);
  var hpd   = parseFloat(document.getElementById('hpd-'+id).value);
  var dpw   = parseFloat(document.getElementById('dpw-'+id).value);
  var start = document.getElementById('start-'+id).value;
  var end   = document.getElementById('end-'+id).value;
  var el    = document.getElementById('result-'+id);

  if (!rate || !hpd || !dpw || !start || !end) {
    el.className = 'job-result empty';
    el.innerHTML = 'Enter details above to calculate this job';
    jobs[id] = { calc: 0, valid: false };
    updateTotal(); return;
  }
  var s = new Date(start), e = new Date(end);
  if (e <= s) {
    el.className = 'job-result empty';
    el.innerHTML = '<span style="color:#ef4444">End date must be after start date</span>';
    jobs[id] = { calc: 0, valid: false };
    updateTotal(); return;
  }
  var weeks = (e - s) / (7*24*60*60*1000);
  var hours = Math.round(weeks * dpw * hpd);
  var total = Math.round(rate * weeks * dpw * hpd);
  var weeksR = Math.round(weeks * 10) / 10;

  jobs[id] = { calc: total, valid: true, label: 'Job ' + id };

  el.className = 'job-result filled';
  el.innerHTML =
    '<div class="job-result-amount">$' + total.toLocaleString() + '</div>' +
    '<div class="job-result-meta">' + weeksR + ' weeks &nbsp;·&nbsp; ' + hours.toLocaleString() + ' hrs &nbsp;·&nbsp; $' + rate + '/hr</div>';

  updateTotal();
}

function updateTotal() {
  var grandTotal = 0;
  var validCount = 0;
  var breakdown  = [];

  Object.keys(jobs).forEach(function(id) {
    if (jobs[id].valid) {
      grandTotal += jobs[id].calc;
      validCount++;
      breakdown.push({ label: 'Job ' + id, amount: jobs[id].calc });
    }
  });

  var stated = parseFloat(document.getElementById('stated').value);
  var el = document.getElementById('total-result');

  if (validCount === 0) {
    el.innerHTML = '<div class="empty-hint">Fill in job details above to see totals</div>';
    return;
  }

  var breakdownHTML = '';
  if (breakdown.length > 1) {
    breakdownHTML = '<div class="job-breakdown">';
    breakdown.forEach(function(b) {
      breakdownHTML += '<div class="job-breakdown-row">' + b.label + '<span>$' + b.amount.toLocaleString() + '</span></div>';
    });
    breakdownHTML += '<div class="job-breakdown-row" style="font-weight:700;color:#111827;border-top:1px solid rgba(0,0,0,0.08);padding-top:4px;margin-top:2px;">Total calculated<span style="color:#111827">$' + grandTotal.toLocaleString() + '</span></div>';
    breakdownHTML += '</div>';
  }

  if (!isNaN(stated) && stated > 0) {
    var diff = Math.abs(grandTotal - stated);
    var pct  = Math.round((diff / grandTotal) * 100);
    var ok   = pct <= 5;
    var cardClass = ok ? 'total-match' : 'total-mismatch';
    var badgeClass = ok ? 'badge-match' : 'badge-mismatch';
    var badgeText  = ok ? '✓ Amounts match' : '✗ Mismatch — review';

    var html = '<div class="total-box ' + cardClass + '">';
    html += '<div class="total-top">';
    html += '<div><div class="total-label">Total calculated earnings</div><div class="total-amount">$' + grandTotal.toLocaleString() + '</div></div>';
    html += '<span class="status-badge ' + badgeClass + '">' + badgeText + '</span>';
    html += '</div>';
    html += breakdownHTML;
    if (!ok) {
      var dir = grandTotal > stated ? 'understated' : 'overstated';
      html += '<div class="alert alert-warn"><strong>Action required:</strong> Claimant ' + dir + ' total earnings by $' + diff.toLocaleString() + ' (~' + pct + '%). Go back and correct Total Earnings to <strong>$' + grandTotal.toLocaleString() + '</strong>.</div>';
    } else {
      html += '<div class="alert alert-ok">Stated amount of <strong>$' + stated.toLocaleString() + '</strong> is consistent with all jobs combined. Safe to continue.</div>';
    }
    html += '</div>';
    el.innerHTML = html;
  } else {
    var html = '<div class="total-box total-neutral">';
    html += '<div class="total-top"><div><div class="total-label">Total calculated earnings</div><div class="total-amount">$' + grandTotal.toLocaleString() + '</div></div>';
    html += '<span class="status-badge badge-neutral">Enter stated amount</span></div>';
    html += breakdownHTML;
    html += '</div>';
    el.innerHTML = html;
  }
}

// Start with one job by default
addJob();
</script>
</body>
</html>
