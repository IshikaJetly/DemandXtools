<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earnings Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f6f8;
    padding: 16px;
    font-size: 14px;
    color: #2c2c2c;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    border: 1px solid #e2e4e8;
    padding: 18px;
    max-width: 680px;
    margin: 0 auto;
  }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6b7280;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .card-title svg { width:15px; height:15px; flex-shrink:0; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: #6b7280; font-weight: 500; }
  .field input {
    height: 34px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    padding: 0 10px;
    font-size: 13px;
    color: #111827;
    background: #fff;
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
  }
  .field input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
  .divider { border: none; border-top: 1px solid #f0f0f0; margin: 14px 0; }
  .stated-section label { font-size: 12px; font-weight: 500; color: #6b7280; display: block; margin-bottom: 5px; }
  .stated-input-wrap { display: flex; align-items: center; gap: 6px; }
  .dollar { font-size: 14px; color: #9ca3af; font-weight: 500; }
  .stated-input-wrap input {
    height: 34px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    padding: 0 10px;
    font-size: 13px;
    color: #111827;
    background: #fff;
    width: 180px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .stated-input-wrap input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
  .hint { font-size: 11px; color: #9ca3af; margin-top: 3px; }
  #result-area { margin-top: 14px; }
  .result-neutral {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 14px 16px;
  }
  .result-match {
    background: #f0fdf4;
    border: 1px solid #86efac;
    border-radius: 8px;
    padding: 14px 16px;
  }
  .result-mismatch {
    background: #fef2f2;
    border: 1px solid #fca5a5;
    border-radius: 8px;
    padding: 14px 16px;
  }
  .result-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .result-label { font-size: 12px; color: #6b7280; font-weight: 500; margin-bottom: 3px; }
  .result-amount { font-size: 26px; font-weight: 700; color: #111827; }
  .result-match .result-amount { color: #15803d; }
  .result-mismatch .result-amount { color: #b91c1c; }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
  }
  .badge-match { background: #dcfce7; color: #15803d; }
  .badge-mismatch { background: #fee2e2; color: #b91c1c; }
  .badge-neutral { background: #f3f4f6; color: #6b7280; }
  .breakdown { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 4px; }
  .breakdown-item { font-size: 11px; color: #9ca3af; }
  .breakdown-item span { color: #4b5563; font-weight: 500; }
  .alert {
    margin-top: 10px;
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.55;
  }
  .alert-warn { background: #fff7ed; border-left: 3px solid #f97316; color: #7c2d12; }
  .alert-ok { background: #f0fdf4; border-left: 3px solid #22c55e; color: #14532d; }
  .empty-hint {
    text-align: center;
    font-size: 12px;
    color: #9ca3af;
    padding: 12px 0 4px;
  }
  @media (max-width: 480px) {
    .grid3 { grid-template-columns: 1fr 1fr; }
    .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="card-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="10" x2="16" y2="10"/>
      <line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="12" y2="18"/>
    </svg>
    Earnings Calculator — Agent Use Only
  </div>

  <div class="grid3">
    <div class="field">
      <label for="rate">Pay rate ($/hr)</label>
      <input type="number" id="rate" placeholder="e.g. 15.00" min="0" step="0.01" oninput="calc()">
    </div>
    <div class="field">
      <label for="hpd">Avg hours/day</label>
      <input type="number" id="hpd" placeholder="e.g. 8" min="0" step="0.5" oninput="calc()">
    </div>
    <div class="field">
      <label for="dpw">Avg days/week</label>
      <input type="number" id="dpw" placeholder="e.g. 5" min="0" step="0.5" oninput="calc()">
    </div>
  </div>

  <div class="grid2">
    <div class="field">
      <label for="startDate">Start date of job</label>
      <input type="date" id="startDate" oninput="calc()">
    </div>
    <div class="field">
      <label for="endDate">End date of job</label>
      <input type="date" id="endDate" oninput="calc()">
    </div>
  </div>

  <hr class="divider">

  <div class="stated-section">
    <label>Claimant stated total earnings ($)</label>
    <div class="stated-input-wrap">
      <span class="dollar">$</span>
      <input type="number" id="stated" placeholder="e.g. 10000" min="0" step="1" oninput="calc()">
    </div>
    <p class="hint">Enter the amount the claimant stated on the previous step</p>
  </div>

  <div id="result-area">
    <div class="empty-hint">Fill in all fields above to see the calculated total</div>
  </div>
</div>

<script>
function calc() {
  var rate = parseFloat(document.getElementById('rate').value);
  var hpd = parseFloat(document.getElementById('hpd').value);
  var dpw = parseFloat(document.getElementById('dpw').value);
  var start = document.getElementById('startDate').value;
  var end = document.getElementById('endDate').value;
  var stated = parseFloat(document.getElementById('stated').value);
  var area = document.getElementById('result-area');

  if (!rate || !hpd || !dpw || !start || !end) {
    area.innerHTML = '<div class="empty-hint">Fill in all fields above to see the calculated total</div>';
    return;
  }

  var startD = new Date(start);
  var endD = new Date(end);
  if (endD <= startD) {
    area.innerHTML = '<div class="empty-hint" style="color:#ef4444">End date must be after start date</div>';
    return;
  }

  var msPerWeek = 7 * 24 * 60 * 60 * 1000;
  var weeks = (endD - startD) / msPerWeek;
  var totalHours = weeks * dpw * hpd;
  var calculated = rate * totalHours;
  var calcRounded = Math.round(calculated);
  var weeksRounded = Math.round(weeks * 10) / 10;
  var hoursRounded = Math.round(totalHours);

  var html = '';

  if (!isNaN(stated) && stated > 0) {
    var diff = Math.abs(calcRounded - stated);
    var pct = Math.round((diff / calcRounded) * 100);
    var isMatch = pct <= 5;
    var cardClass = isMatch ? 'result-match' : 'result-mismatch';
    var badgeClass = isMatch ? 'badge-match' : 'badge-mismatch';
    var icon = isMatch
      ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
      : '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    var statusText = isMatch ? 'Amounts match' : 'Mismatch — review';

    html += '<div class="' + cardClass + '">';
    html += '<div class="result-top">';
    html += '<div><div class="result-label">Calculated total</div><div class="result-amount">$' + calcRounded.toLocaleString() + '</div></div>';
    html += '<span class="status-badge ' + badgeClass + '">' + icon + statusText + '</span>';
    html += '</div>';
    html += '<div class="breakdown">';
    html += '<div class="breakdown-item">Duration: <span>' + weeksRounded + ' weeks</span></div>';
    html += '<div class="breakdown-item">Total hours: <span>' + hoursRounded.toLocaleString() + ' hrs</span></div>';
    html += '<div class="breakdown-item">Stated: <span>$' + stated.toLocaleString() + '</span></div>';
    if (!isMatch) html += '<div class="breakdown-item">Difference: <span style="color:#b91c1c">$' + diff.toLocaleString() + ' (' + pct + '%)</span></div>';
    html += '</div>';
    if (!isMatch) {
      var direction = calcRounded > stated ? 'understated' : 'overstated';
      html += '<div class="alert alert-warn"><strong>Action required:</strong> Claimant ' + direction + ' earnings by $' + diff.toLocaleString() + ' (~' + pct + '%). Go back and correct the Total Earnings field to <strong>$' + calcRounded.toLocaleString() + '</strong> before continuing.</div>';
    } else {
      html += '<div class="alert alert-ok">Stated amount of <strong>$' + stated.toLocaleString() + '</strong> is consistent with the hourly breakdown. Safe to continue.</div>';
    }
    html += '</div>';
  } else {
    html += '<div class="result-neutral">';
    html += '<div class="result-top">';
    html += '<div><div class="result-label">Calculated total</div><div class="result-amount">$' + calcRounded.toLocaleString() + '</div></div>';
    html += '<span class="status-badge badge-neutral">No stated amount yet</span>';
    html += '</div>';
    html += '<div class="breakdown">';
    html += '<div class="breakdown-item">Duration: <span>' + weeksRounded + ' weeks</span></div>';
    html += '<div class="breakdown-item">Total hours: <span>' + hoursRounded.toLocaleString() + ' hrs</span></div>';
    html += '</div></div>';
  }

  area.innerHTML = html;
}
</script>
</body>
</html>
