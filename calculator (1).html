<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earnings Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f2f5;
    font-size: 13px;
    color: #2c2c2c;
    height: auto;
    overflow: hidden;
  }
  .card {
    background: #fff;
    border-radius: 8px;
    border: 1px solid #e2e4e8;
    padding: 14px 16px;
    margin: 10px;
  }
  .card-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: #6b7280;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; color: #6b7280; font-weight: 500; }
  .field input {
    height: 30px;
    border: 1px solid #d1d5db;
    border-radius: 5px;
    padding: 0 8px;
    font-size: 12px;
    color: #111827;
    background: #fff;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    width: 100%;
  }
  .field input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
  .divider { border: none; border-top: 1px solid #f0f0f0; margin: 10px 0; }
  .stated-row { display: flex; align-items: center; gap: 6px; }
  .stated-row label { font-size: 11px; color: #6b7280; font-weight: 500; white-space: nowrap; }
  .dollar { font-size: 13px; color: #9ca3af; }
  .stated-row input {
    height: 30px;
    border: 1px solid #d1d5db;
    border-radius: 5px;
    padding: 0 8px;
    font-size: 12px;
    color: #111827;
    width: 150px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .stated-row input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
  .hint { font-size: 10px; color: #9ca3af; margin-top: 2px; }
  #result-area { margin-top: 10px; }
  .result-neutral { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 7px; padding: 10px 12px; }
  .result-match   { background: #f0fdf4; border: 1px solid #86efac; border-radius: 7px; padding: 10px 12px; }
  .result-mismatch{ background: #fef2f2; border: 1px solid #fca5a5; border-radius: 7px; padding: 10px 12px; }
  .result-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .result-label { font-size: 11px; color: #6b7280; font-weight: 500; margin-bottom: 2px; }
  .result-amount { font-size: 22px; font-weight: 700; color: #111827; line-height: 1; }
  .result-match .result-amount   { color: #15803d; }
  .result-mismatch .result-amount{ color: #b91c1c; }
  .status-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .badge-match    { background: #dcfce7; color: #15803d; }
  .badge-mismatch { background: #fee2e2; color: #b91c1c; }
  .badge-neutral  { background: #f3f4f6; color: #6b7280; }
  .breakdown { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; }
  .breakdown-item { font-size: 11px; color: #9ca3af; }
  .breakdown-item span { color: #4b5563; font-weight: 500; }
  .alert { margin-top: 8px; padding: 7px 10px; border-radius: 5px; font-size: 11px; line-height: 1.55; }
  .alert-warn { background: #fff7ed; border-left: 3px solid #f97316; color: #7c2d12; }
  .alert-ok   { background: #f0fdf4; border-left: 3px solid #22c55e; color: #14532d; }
  .empty-hint { text-align: center; font-size: 11px; color: #9ca3af; padding: 8px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="card-title">
    &#9635; Earnings Calculator — Agent Use Only
  </div>

  <div class="grid3">
    <div class="field">
      <label for="rate">Pay rate ($/hr)</label>
      <input type="number" id="rate" placeholder="e.g. 15.00" min="0" step="0.01" oninput="calc()">
    </div>
    <div class="field">
      <label for="hpd">Avg hours/day</label>
      <input type="number" id="hpd" placeholder="e.g. 8" min="0" step="0.5" oninput="calc()">
    </div>
    <div class="field">
      <label for="dpw">Avg days/week</label>
      <input type="number" id="dpw" placeholder="e.g. 5" min="0" step="0.5" oninput="calc()">
    </div>
  </div>

  <div class="grid2">
    <div class="field">
      <label for="startDate">Start date</label>
      <input type="date" id="startDate" oninput="calc()">
    </div>
    <div class="field">
      <label for="endDate">End date</label>
      <input type="date" id="endDate" oninput="calc()">
    </div>
  </div>

  <hr class="divider">

  <div class="stated-row">
    <label>Claimant stated earnings:</label>
    <span class="dollar">$</span>
    <input type="number" id="stated" placeholder="e.g. 10000" min="0" step="1" oninput="calc()">
  </div>
  <p class="hint">Enter the amount from the previous Total Earnings step</p>

  <div id="result-area">
    <div class="empty-hint">Fill in all fields above to see the calculated total</div>
  </div>
</div>

<script>
function calc() {
  var rate  = parseFloat(document.getElementById('rate').value);
  var hpd   = parseFloat(document.getElementById('hpd').value);
  var dpw   = parseFloat(document.getElementById('dpw').value);
  var start = document.getElementById('startDate').value;
  var end   = document.getElementById('endDate').value;
  var stated= parseFloat(document.getElementById('stated').value);
  var area  = document.getElementById('result-area');

  if (!rate || !hpd || !dpw || !start || !end) {
    area.innerHTML = '<div class="empty-hint">Fill in all fields above to see the calculated total</div>';
    return;
  }
  var startD = new Date(start), endD = new Date(end);
  if (endD <= startD) { area.innerHTML = '<div class="empty-hint" style="color:#ef4444">End date must be after start date</div>'; return; }

  var weeks      = (endD - startD) / (7*24*60*60*1000);
  var totalHours = weeks * dpw * hpd;
  var calcRounded= Math.round(rate * totalHours);
  var weeksR     = Math.round(weeks * 10) / 10;
  var hoursR     = Math.round(totalHours);

  var html = '';
  if (!isNaN(stated) && stated > 0) {
    var diff = Math.abs(calcRounded - stated);
    var pct  = Math.round((diff / calcRounded) * 100);
    var ok   = pct <= 5;
    html += '<div class="' + (ok ? 'result-match' : 'result-mismatch') + '">';
    html += '<div class="result-top">';
    html += '<div><div class="result-label">Calculated total</div><div class="result-amount">$' + calcRounded.toLocaleString() + '</div></div>';
    html += '<span class="status-badge ' + (ok ? 'badge-match' : 'badge-mismatch') + '">' + (ok ? '✓ Amounts match' : '✗ Mismatch — review') + '</span>';
    html += '</div>';
    html += '<div class="breakdown"><div class="breakdown-item">Duration: <span>' + weeksR + ' wks</span></div><div class="breakdown-item">Hours: <span>' + hoursR.toLocaleString() + '</span></div><div class="breakdown-item">Stated: <span>$' + stated.toLocaleString() + '</span></div>';
    if (!ok) html += '<div class="breakdown-item">Diff: <span style="color:#b91c1c">$' + diff.toLocaleString() + ' (' + pct + '%)</span></div>';
    html += '</div>';
    if (!ok) {
      var dir = calcRounded > stated ? 'understated' : 'overstated';
      html += '<div class="alert alert-warn"><strong>Action required:</strong> Claimant ' + dir + ' earnings by $' + diff.toLocaleString() + ' (~' + pct + '%). Go back and correct Total Earnings to <strong>$' + calcRounded.toLocaleString() + '</strong>.</div>';
    } else {
      html += '<div class="alert alert-ok">Stated amount of <strong>$' + stated.toLocaleString() + '</strong> is consistent. Safe to continue.</div>';
    }
    html += '</div>';
  } else {
    html += '<div class="result-neutral"><div class="result-top"><div><div class="result-label">Calculated total</div><div class="result-amount">$' + calcRounded.toLocaleString() + '</div></div><span class="status-badge badge-neutral">Enter stated amount</span></div>';
    html += '<div class="breakdown"><div class="breakdown-item">Duration: <span>' + weeksR + ' wks</span></div><div class="breakdown-item">Hours: <span>' + hoursR.toLocaleString() + '</span></div></div></div>';
  }
  area.innerHTML = html;
}
</script>
</body>
</html>
